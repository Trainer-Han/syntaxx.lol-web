<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: it was set to 1, which stops pinch-zoom on iOS and
         Android. Zoom is how a low-vision reader reads small text, and taking
         it away is an accessibility failure with no upside — the layout is
         responsive and does not need protecting from it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Syntaxx — Discord Bot</title>
    <meta name="description" content="Syntaxx — the most powerful Belgian Discord bot. Moderation, economy, leveling, auto-mod and more. Free, with 100+ commands." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://syntaxx.lol/" />
    <meta property="og:site_name" content="Syntaxx" />
    <meta property="og:url" content="https://syntaxx.lol/" />
    <meta property="og:title" content="Syntaxx — Discord Bot" />
    <meta property="og:description" content="Moderation, economy, leveling, auto-mod and more. Everything your server needs in one bot." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/syntaxx-logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The Syntaxx logo: a gold and a platinum diamond overlapping on a black tile." />
    <!-- The logo is square, so it is a summary card, not a summary_large_image
         one. Declaring the wide card for a 1:1 image makes X crop it. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Syntaxx — Discord Bot" />
    <meta name="twitter:description" content="Moderation, economy, leveling, auto-mod and more." />
    <meta name="twitter:image" content="/syntaxx-logo.png" />
    <!-- Generated by scripts/make-icons.mjs from web/public/syntaxx-logo.png.
         Re-run it if the artwork changes. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Must match INK in web/src/theme.ts and --background in index.css.
         A mismatch shows as a seam between the browser chrome and the page on
         Android and on iOS Safari. -->
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Only weights that are actually served. The css2 endpoint answers 200
         for any value you ask for and quietly returns the nearest static
         instance, so requesting 550 or 650 looks like it works and does not:
         the UI must stick to this set. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8559400574092394" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
