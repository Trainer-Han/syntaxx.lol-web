name: Deploy site

# Only live-website deploys. Pushing to main can never reach syntaxx.lol.
#
# Unlike the bot repo, this is not manual-trigger-only: the whole point of the
# two-branch split is that merging the PR *is* the deploy decision. The gate is
# the merge, which stays a human action.
on:
  push:
    branches: [live-website]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Static checks
        run: node scripts/verify.js

      - name: Build the SPA
        run: npm run build

      # Schema changes reach D1 before the code that depends on them. Already
      # applied migrations are skipped, so re-running is harmless.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply syntaxx-site --remote

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Summary
        if: success()
        run: echo "Deployed to https://syntaxx.lol" >> "$GITHUB_STEP_SUMMARY"
